[Wrist]
; Cuff removed; use the thumbrest sensors and left Menu button.
Enabled=0

[Controls]
; Hold right thumbrest touch and double-tap left thumbrest: consumables.
; Hold left thumbrest touch and double-tap right thumbrest: weapons. No stick click.
; Development tutorial: triple Menu toggles guide; single tap waits450ms; double cancels.
; Hold left Menu: seated settings. Normal trigger/grip/A/X stay native.
; DoubleTapMs is the maximum gap between taps. HoldMs applies only to Menu.
; Both rests together, modifier loss or a menu interruption cancel the taps.
; Left Menu is overridden during gameplay only. Face buttons stay native.
HoldMs=1000
DoubleTapMs=450

[Hands]
; Each free hand uses Touch sensors. Occupied/support hands keep native poses.
; Set 0 to retain TTR's original finger animation. Takes effect next launch.
FingerGestures=1

[Selector]
; Placement is latched in the world when the selector opens.
ForwardCm=60
BelowEyesCm=14.3
RadiusCm=20
; Extra distance around each visible mesh for fingertip/palm contact.
TouchRadiusCm=3
PreviewSizeCm=22.9
; Diameter of the center bottle cap: touch to holster/stow without consuming.
CenterCapSizeCm=12

[Weapons]
; 1: automatic reload. 0: native manual reload. Applied after TTR initializes.
; Tap left Menu to switch the native reload mode.
AutomaticReload=1
; Manual-mode drops stay physical; requires the included Reload Parts ESP.
; Uses native grip/throw and Take; takes effect next launch.
PhysicalReloadParts=1
; Native torso-anchored ammo pouch in comfortable seated reach, in manual mode.
; Set 0 to preserve TTR's own pouch placement. Values below are centimetres.
SeatedAmmoPouch=1
PouchForwardCm=40
PouchSideCm=-18
PouchBelowEyesCm=45

[UI]
; Toggle with Y inside the height panel. All height messages always remain on.
ShowSelectorPopups=0

[Seated]
; Hold left Menu, release, press A while seated, then B to save.
HeightOffsetCm=0
TargetEyeHeightCm=165

[OpenXR]
; Optional absolute runtime JSON for this game only. Blank uses your normal runtime.
; An explicit XR_RUNTIME_JSON from a launcher takes precedence.
RuntimeJson=
