[Wrist]
; The two thumbrest gestures open the wheels. Settings are on Filthy.
Enabled=0

[Controls]
; Hold right thumbrest touch and double-tap left thumbrest: consumables.
; Hold left thumbrest touch and double-tap right thumbrest: weapons. No stick click.
; Left-stick click retains TTR's native Wait.
; Open Filthy on the full Pip-Boy or from the active Wrist-Boy with right-stick click.
; DoubleTapMs is the maximum gap between thumbrest taps.
; Both rests together, modifier loss or a menu interruption cancel the taps.
; The wheel gesture leaves the normal stick click assignments in place.
HoldMs=1000
DoubleTapMs=450

[Hands]
; Each free hand uses Touch sensors. Occupied/support hands keep native poses.
; Set 0 to retain TTR's original finger animation. Takes effect next launch.
FingerGestures=1

[Selector]
; Placement is latched in the world when the selector opens.
ForwardCm=60
BelowEyesCm=14.3
RadiusCm=20
; Extra distance around each visible mesh for fingertip/palm contact.
TouchRadiusCm=3
PreviewSizeCm=22.9
; Diameter of the center bottle cap: touch to holster/stow without consuming.
CenterCapSizeCm=12

[Weapons]
; 1: automatic reload. 0: native manual reload. Applied after TTR initializes.
; Use the Reload mode row in Filthy to switch during play.
AutomaticReload=1
; Latest supported TTR owns physical drops and recovered ammo.
; Legacy addon integration is disabled on that host, even if set to 1.
PhysicalReloadParts=0
; Native torso-anchored ammo pouch in comfortable seated reach, in manual mode.
; Set 0 to preserve TTR's own pouch placement. Values below are centimetres.
SeatedAmmoPouch=1
PouchForwardCm=40
PouchSideCm=-18
PouchBelowEyesCm=45

[UI]
; Settings > Seated height > Selector messages. Height-save messages remain on.
ShowSelectorPopups=0

[Seated]
; Settings > Seated height > Calibrate height. Changes save automatically.
HeightOffsetCm=0
; Independent mounted adjustments in centimetres; ground calibration stays unchanged.
CarSeatOffsetCm=0
FlightSeatOffsetCm=0
BighornerSeatOffsetCm=0
DeathclawSeatOffsetCm=0
TargetEyeHeightCm=165

[OpenXR]
; Optional absolute runtime JSON for this game only. Blank uses your normal runtime.
; An explicit XR_RUNTIME_JSON from a launcher takes precedence.
RuntimeJson=

[Reload]
; Hand recovered native magazines back to native insertion/pouch handling.
; Exact supported TTR build only; native code still owns drops and ammo counts.
RecoverWorldMagazines=1

[Bindings]
; Typed inputs: RightStickClick, LeftGrip, A, B, X, Y, LeftMenu, etc.
; Combos: RightGrip+LeftGrip,Hold,1000 (delay 200-2000 ms).
; Default keeps your saved profile; Off disables the destination.
MenuButton=Default
; Direct access independent of the Menu button. Off preserves existing access.
OpenControls=Off
OpenControlsOnStart=0
; Every exposed channel can be overridden here; see docs/CONTROLS-EDITOR.md.

[Walking]
; Movement zones are adjustable on foot in Settings > Hands and walking.
Enabled=0
Deadzone=0.15
RunStart=0.60
Speed=0.55
AutoWalk=0

[Sprint]
; Native Travel Light icon and start message, once per sprint. Settings > Sprint.
ShowNotification=1
; Full forward tip only, on foot. Cost is AP per second (0 = free).
Enabled=1
StartThreshold=0.97
StopThreshold=0.90
SpeedMultiplier=2.00
APPerSecond=15

[WristLight]
; Knuckle-mounted lamp, wrist-guided aim, no retaining ring. 0 restores legacy floating placement.
GloveMount=1
; 1: projected local candidate; 0: previous contact-light path.
Projected=1
; Candidate directional Pip-Boy wrist light. 0 restores native light.
Enabled=1
Brightness=1.3
BeamDegrees=32
RangeMetres=35
; Position relative to left wrist, toward knuckles and above back of hand.
; Aim follows wrist rotation, independent of forearm IK and fingertip curl.
ForwardCm=-4.29
AboveCm=6.00
Red=1.0
Green=0.93
Blue=0.78

[FeatureSetup]
; Fresh installs start unchecked. Existing INIs are preserved on upgrade.
FirstRun=1
